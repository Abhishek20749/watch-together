<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WatchParty 🎬</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Join Screen -->
    <div id="join-screen" class="screen">
        <div class="join-container">
            <div class="join-logo">🎬</div>
            <h1>WatchParty</h1>
            <p>Watch together, stay connected</p>
            <input type="text" id="username-input" placeholder="Your name" maxlength="20">
            <input type="text" id="room-input" placeholder="Room code (or leave blank to create)">
            <button id="join-btn">Enter Room</button>
        </div>
    </div>

    <!-- Watch Screen -->
    <div id="watch-screen" class="screen hidden">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="room-name" id="room-name">Room</div>
            <div class="top-bar-right">
                <span class="user-count" id="user-count">👥 1</span>
                <button class="btn-icon" id="copy-room-btn" title="Copy room code">📋</button>
            </div>
        </div>

        <!-- Video Area -->
        <div class="video-area" id="video-area">
            <video id="video-player" controls playsinline webkit-playsinline></video>
            <div id="no-video" class="no-video-overlay">
                <label for="file-input" class="choose-file-btn">📁 Choose Video</label>
                <input type="file" id="file-input" accept="video/*" hidden>
            </div>
            <button class="fullscreen-btn" id="fullscreen-btn">⛶</button>
        </div>

        <!-- Chat Area -->
        <div class="chat-area" id="chat-area">
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-bar">
                <input type="text" id="chat-input" placeholder="Aa" maxlength="500">
                <button id="send-btn">➤</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
